<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED Matrix Check</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --mute:#b9b9b2; --box:#2b2b2b; --cur:#d4351c; --done:#7a7a74; --card:#fff; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16171a; --fg:#ececea; --mute:#55565b; --box:#d8d8d4; --cur:#ff6a4d; --done:#9a9a94; --card:#1f2024; --line:#333; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:0 0 8px; }
  .steps { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  .steps button { font:inherit; padding:8px 14px; border:2px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; cursor:pointer; }
  .steps button.on { border-color:var(--cur); color:var(--cur); font-weight:700; }
  #todo { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px 10px 40px; margin-bottom:12px; font-size:18px; }
  #todo li { margin:3px 0; }
  .parts { display:flex; flex-wrap:wrap; gap:16px; }
  .part { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .part h2 { font-size:17px; margin:2px 6px 4px; }
  svg text { fill:currentColor; }
  .lbl { font-size:15px; }
  .pn { font-size:13px; }
  .k-cur { fill:var(--cur) !important; font-weight:700; }
  .k-done { fill:var(--done) !important; }
  .k-later { fill:var(--mute) !important; }
</style>
</head>
<body>
<main>
<h1>LED matrix check: wiring</h1>
<div>All drawn from above. Chips: notch at the top. Matrix: the row that lit the dot (pins 1–8) facing you.
Red = this step, grey = done, faint = later.</div>
<div class="steps" id="steps"></div>
<ol id="todo"></ol>
<div class="parts" id="parts"></div>
</main>
<script>
// [part, pin, where it goes, step]
const W = [
  ['A',16,'3V3',2],['A',10,'3V3',2],['A',8,'GND',2],['A',13,'GND',2],
  ['B',16,'3V3',2],['B',10,'3V3',2],['B',8,'GND',2],['B',13,'GND',2],
  ['A',14,'D25',3],['A',11,'D26 + chip B 11',3],['B',11,'chip A 11',3],
  ['A',12,'D27 + chip B 12',3],['B',12,'chip A 12',3],['A',9,'chip B 14',3],['B',14,'chip A 9',3],
];
const ROWS = [[15,9],[1,14],[2,8],[3,12],[4,1],[5,7],[6,2],[7,5]];  // chip B pin -> matrix pin, via 220R
const COLS = [[15,13],[1,3],[2,4],[3,10],[4,6],[5,11],[6,15],[7,16]]; // chip A pin -> matrix pin, direct
for (const [c,m] of ROWS) { W.push(['B',c,'220Ω → matrix '+m,4]); W.push(['M',m,'220Ω → chip B '+c,4]); }
for (const [c,m] of COLS) { W.push(['A',c,'matrix '+m,5]); W.push(['M',m,'chip A '+c,5]); }

const TODO = {
  2: ['Pins 16 and 10 → 3V3, pins 8 and 13 → GND, on both chips'],
  3: ['D25 → chip A 14','D26 → chip A 11 → chip B 11','D27 → chip A 12 → chip B 12','chip A 9 → chip B 14'],
  4: ROWS.map(([c,m]) => `chip B ${c} → 220Ω → matrix ${m}`),
  5: COLS.map(([c,m]) => `chip A ${c} → matrix ${m} (no resistor)`),
};
let step = 4;
try { step = +localStorage.getItem('mtxstep') || 4; } catch (e) {}

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function where(part, pin) { return W.find(w => w[0] === part && w[1] === pin); }
function cls(w) { return !w ? 'k-later' : w[3] === step ? 'k-cur' : w[3] < step ? 'k-done' : 'k-later'; }

function chip(part, title) {
  const s = el('svg', {width: 470, height: 330, viewBox: '0 0 470 330'});
  const x0 = 190, y0 = 20, w = 90, pitch = 36;
  s.append(el('rect', {x:x0, y:y0, width:w, height:pitch*8, rx:6, fill:'none', stroke:'var(--box)', 'stroke-width':2}));
  s.append(el('path', {d:`M${x0+w/2-12} ${y0} a12 12 0 0 0 24 0`, fill:'none', stroke:'var(--box)', 'stroke-width':2}));
  s.append(el('text', {x:x0+w/2, y:y0+pitch*4+5, 'text-anchor':'middle', class:'lbl'}, '595 ' + part));
  for (let i = 0; i < 8; i++) {
    const y = y0 + pitch*i + pitch/2;
    for (const [pin, side] of [[i+1, -1], [16-i, 1]]) {
      const px = side < 0 ? x0 : x0 + w;
      s.append(el('line', {x1:px, y1:y, x2:px+side*14, y2:y, stroke:'var(--box)', 'stroke-width':3}));
      s.append(el('text', {x:px - side*6, y:y+4, 'text-anchor': side<0?'start':'end', class:'pn'}, pin));
      const wi = where(part, pin);
      if (wi) s.append(el('text', {x:px+side*20, y:y+5, 'text-anchor': side<0?'end':'start', class:'lbl '+cls(wi)}, wi[2]));
    }
  }
  return wrap(title, s);
}
function matrix() {
  const s = el('svg', {width: 900, height: 330, viewBox: '0 0 900 330'});
  const x0 = 110, w = 680, y0 = 110, h = 110, pitch = w/8;
  s.append(el('rect', {x:x0, y:y0, width:w, height:h, rx:6, fill:'none', stroke:'var(--box)', 'stroke-width':2}));
  s.append(el('text', {x:x0+w/2, y:y0+h/2+5, 'text-anchor':'middle', class:'lbl'}, 'LED matrix (pins 1–8 facing you)'));
  for (let i = 0; i < 8; i++) {
    const x = x0 + pitch*i + pitch/2;
    for (const [pin, top] of [[16-i, true], [i+1, false]]) {
      const py = top ? y0 : y0 + h;
      const d = top ? -1 : 1;
      s.append(el('line', {x1:x, y1:py, x2:x, y2:py+d*14, stroke:'var(--box)', 'stroke-width':3}));
      s.append(el('text', {x:x, y:py - d*8 + (top?4:4), 'text-anchor':'middle', class:'pn'}, pin));
      const wi = where('M', pin);
      if (wi) {
        const parts = wi[2].split(' → ');
        parts.forEach((t, j) => {
          const yy = top ? py - 22 - (parts.length-1-j)*18 : py + 32 + j*18;
          s.append(el('text', {x:x, y:yy, 'text-anchor':'middle', class:'lbl '+cls(wi)}, t));
        });
      }
    }
  }
  return wrap('Matrix', s);
}
function wrap(title, svg) {
  const d = document.createElement('div'); d.className = 'part';
  const h = document.createElement('h2'); h.textContent = title;
  svg.style.maxWidth = '100%'; svg.style.height = 'auto';
  d.append(h, svg); return d;
}
function render() {
  const st = document.getElementById('steps'); st.innerHTML = '';
  for (const n of [2,3,4,5]) {
    const b = document.createElement('button');
    b.textContent = 'Step ' + n; if (n === step) b.className = 'on';
    b.onclick = () => { step = n; try { localStorage.setItem('mtxstep', n); } catch (e) {} render(); };
    st.append(b);
  }
  const td = document.getElementById('todo'); td.innerHTML = '';
  for (const t of TODO[step]) { const li = document.createElement('li'); li.textContent = t; td.append(li); }
  const p = document.getElementById('parts'); p.innerHTML = '';
  p.append(chip('A', 'Chip A (far from the matrix)'), chip('B', 'Chip B (near the matrix)'), matrix());
}
render();
</script>
</body>
</html>
